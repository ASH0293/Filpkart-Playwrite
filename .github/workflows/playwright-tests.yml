name: Playwright tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  robot-browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright browser and system dependencies
        run: rfbrowser init chromium --with-deps

      - name: Run all Robot Framework browser tests
        run: >-
          xvfb-run -a robot
          --variable HEADLESS:False
          --outputdir results
          --log log.html
          --report report.html
          Test

      - name: Upload HTML test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-reports
          path: |
            results/report.html
            results/log.html
          if-no-files-found: warn
          retention-days: 14
